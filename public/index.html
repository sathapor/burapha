<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เก็บเงินแก๊ง Burapha</title>
    <link rel="icon" href="Burapha.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <img src="Burapha.png" alt="Burapha Logo" class="custom-logo">
            <h1>เก็บเงินแก๊ง Burapha</h1>
            <p>ติดตามและจัดการเงินกองทุนแก๊งแบบ Real-time</p>
            <div class="header-badge"><div class="dot"></div> ระบบออนไลน์ (เชื่อมต่อ Discord แล้ว)</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card blue">
                <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-total-members">0</div>
                    <div class="stat-label">สมาชิกทั้งหมด</div>
                </div>
            </div>
            <div class="stat-card green">
                <div class="stat-icon"><i class="fa-solid fa-check-circle"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-paid">0</div>
                    <div class="stat-label">จ่ายแล้วสัปดาห์นี้</div>
                </div>
            </div>
            <div class="stat-card red">
                <div class="stat-icon"><i class="fa-solid fa-times-circle"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-unpaid">0</div>
                    <div class="stat-label">ค้างจ่ายสัปดาห์นี้</div>
                </div>
            </div>
            <div class="stat-card purple">
                <div class="stat-icon"><i class="fa-solid fa-coins"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-amount">0</div>
                    <div class="stat-label">ยอดเก็บได้ (บาท)</div>
                </div>
            </div>
        </div>

        <div class="controls-panel">
            <div class="controls-left">
                <div class="input-group">
                    <label for="action-month">เดือนที่ดูข้อมูล</label>
                    <input type="month" id="action-month" class="styled-input">
                </div>
                <div class="divider"></div>
                <div class="input-group">
                    <label for="action-week">สัปดาห์ปัจจุบัน (จัดการ / แจ้งเตือน)</label>
                    <select id="action-week" class="styled-input"></select>
                </div>
            </div>
            <div class="controls-right">
                <button id="btn-add-member" class="btn btn-add"><i class="fa-solid fa-user-plus"></i> เพิ่มสมาชิก</button>
                <button id="btn-notify" class="btn btn-notify"><i class="fa-solid fa-bullhorn"></i> ทวงเงิน (Discord)</button>
                <button id="btn-summary" class="btn btn-summary"><i class="fa-solid fa-chart-pie"></i> สรุปยอด (Discord)</button>
            </div>
        </div>

        <div class="table-wrapper">
            <div class="table-header-bar">
                <div class="table-title">
                    <i class="fa-solid fa-list"></i> รายชื่อและการจ่ายเงิน
                    <span class="badge">ยอดละ 300,000</span>
                </div>
            </div>
            <div class="table-scroll">
                <table id="payments-table">
                    <thead>
                        <tr id="table-head-row">
                            <th class="sticky-col col-seq">#</th>
                            <th class="sticky-col col-name">สมาชิก</th>
                            <!-- Weeks injected here -->
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Data injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Add Member Modal -->
    <div id="modal-add-member" class="modal-backdrop">
        <div class="modal">
            <div class="modal-title"><i class="fa-solid fa-user-plus"></i> เพิ่มสมาชิกใหม่</div>
            <div class="form-group">
                <label class="form-label">ชื่อสมาชิก</label>
                <input type="text" id="input-member-name" class="form-input" placeholder="เช่น Somchai">
            </div>
            <div class="form-group">
                <label class="form-label">Discord ID (ไม่บังคับ)</label>
                <input type="text" id="input-member-discord" class="form-input" placeholder="ตัวเลข ID (สำหรับ Tag)">
            </div>
            <div class="modal-actions">
                <button class="btn-modal-cancel" id="btn-close-modal">ยกเลิก</button>
                <button class="btn-modal-confirm" id="btn-save-member">บันทึก</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
